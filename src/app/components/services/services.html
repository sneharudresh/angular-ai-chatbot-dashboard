<div class="services-container">
  <h1>Our Services</h1>
  
  <div class="services-list">
    <mat-card *ngFor="let service of services" class="service-card">
      <mat-card-header>
        <mat-card-title>{{ service.title }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>{{ service.description }}</p>
      </mat-card-content>
    </mat-card>
  </div>
</div>
